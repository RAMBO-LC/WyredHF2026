<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graph · SharedBrain</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <script>document.documentElement.dataset.theme = localStorage.getItem('sb-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    body { overflow: hidden; }
    .stage { position: relative; height: calc(100vh - var(--header-h)); background: var(--bg-subtle); }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .toolbar { position: absolute; top: 14px; left: 14px; display: flex; flex-direction: column; gap: 8px; width: 260px; }
    .panel { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
    .legend { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
    .legend-title { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin-bottom: 4px; display: flex; justify-content: space-between; }
    .legend-title button { font: inherit; text-transform: none; letter-spacing: 0; background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; }
    .legend label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; padding: 2px 0; color: var(--text-muted); }
    .legend label .sw { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend label .n { margin-left: auto; font-size: 12px; color: var(--text-faint); }
    .legend input { margin: 0; }
    .info { position: absolute; top: 14px; right: 14px; width: 340px; max-height: calc(100% - 28px); overflow-y: auto; padding: 16px 18px; }
    .info h3 { font-size: 17px; margin-bottom: 6px; }
    .info .excerpt { font-size: 13px; color: var(--text-muted); margin: 12px 0; max-height: 220px; overflow: hidden; position: relative; }
    .info .excerpt::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, var(--bg)); }
    .info h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin: 14px 0 6px; }
    .neighbor { display: block; font-size: 13px; padding: 3px 0; color: var(--text); cursor: pointer; background: none; border: none; text-align: left; font-family: inherit; width: 100%; }
    .neighbor:hover { color: var(--accent); }
    .hud { position: absolute; bottom: 14px; left: 14px; font-size: 12px; color: var(--text-faint); display: flex; gap: 14px; }
    .zoom { position: absolute; bottom: 14px; right: 14px; display: flex; flex-direction: column; overflow: hidden; }
    .zoom button { width: 34px; height: 32px; border: none; background: var(--bg); color: var(--text-muted); cursor: pointer; font-size: 16px; border-bottom: 1px solid var(--border); }
    .zoom button:last-child { border-bottom: none; font-size: 11px; }
    .zoom button:hover { background: var(--bg-muted); color: var(--text); }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="toolbar">
      <input class="input panel" id="search" placeholder="Find a document…" style="box-shadow:var(--shadow)">
      <div class="panel legend" id="legend"></div>
    </div>
    <div class="panel info hidden" id="info"></div>
    <div class="hud" id="hud"></div>
    <div class="panel zoom">
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out">−</button>
      <button id="zoom-fit" title="Fit to screen">FIT</button>
    </div>
  </div>

  <script src="/assets/common.js"></script>
  <script>
    const { api, esc, md } = SB;
    SB.mountHeader('graph');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info');
    let nodes = [];
    let links = [];
    let byId = new Map();
    let neighbors = new Map();
    let folderColor = new Map();
    let hidden = new Set();
    let selected = null;
    let hovered = null;
    let query = '';
    const view = { x: 0, y: 0, k: 1 };
    let alpha = 1;
    let colors = {};

    function readColors() {
      const cs = getComputedStyle(document.documentElement);
      colors = {
        palette: ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--c7', '--c8'].map((v) => cs.getPropertyValue(v).trim()),
        text: cs.getPropertyValue('--text').trim(),
        muted: cs.getPropertyValue('--text-faint').trim(),
        edge: cs.getPropertyValue('--border-strong').trim(),
        bg: cs.getPropertyValue('--bg-subtle').trim(),
        accent: cs.getPropertyValue('--accent').trim(),
      };
      folderColor = new Map([...folderColor.keys()].map((f, i) => [f, colors.palette[i % colors.palette.length]]));
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const r = canvas.getBoundingClientRect();
      canvas.width = r.width * dpr;
      canvas.height = r.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function visible(n) { return !hidden.has(n.folder); }

    function step() {
      if (alpha < 0.005) return;
      const vis = nodes.filter(visible);
      // Repulsion
      for (let i = 0; i < vis.length; i++) {
        const a = vis[i];
        for (let j = i + 1; j < vis.length; j++) {
          const b = vis[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let d2 = dx * dx + dy * dy || 0.01;
          if (d2 > 160000) continue;
          const f = (900 / d2) * alpha;
          const d = Math.sqrt(d2);
          dx /= d; dy /= d;
          a.vx -= dx * f * 10; a.vy -= dy * f * 10;
          b.vx += dx * f * 10; b.vy += dy * f * 10;
        }
      }
      // Springs
      for (const l of links) {
        const a = byId.get(l.source), b = byId.get(l.target);
        if (!a || !b || !visible(a) || !visible(b)) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
        const f = ((d - 70) / d) * 0.04 * alpha;
        a.vx += dx * f; a.vy += dy * f;
        b.vx -= dx * f; b.vy -= dy * f;
      }
      // Gravity + integrate
      for (const n of vis) {
        const g = n.degree ? 0.004 : 0.02;
        n.vx -= n.x * g * alpha;
        n.vy -= n.y * g * alpha;
        if (n.fixed) { n.vx = n.vy = 0; continue; }
        n.vx *= 0.6; n.vy *= 0.6;
        n.x += n.vx; n.y += n.vy;
      }
      alpha *= 0.985;
    }

    function radius(n) { return 3.5 + Math.sqrt(n.degree) * 1.6; }

    function matches(n) { return query && n.title.toLowerCase().includes(query); }

    function draw() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(w / 2 + view.x, h / 2 + view.y);
      ctx.scale(view.k, view.k);

      const focus = hovered || selected;
      const focusSet = focus ? new Set([focus.id, ...(neighbors.get(focus.id) || [])]) : null;

      ctx.lineWidth = 1 / view.k;
      for (const l of links) {
        const a = byId.get(l.source), b = byId.get(l.target);
        if (!a || !b || !visible(a) || !visible(b)) continue;
        const active = focus && (a === focus || b === focus);
        ctx.strokeStyle = active ? colors.accent : colors.edge;
        ctx.globalAlpha = focus ? (active ? 0.9 : 0.12) : 0.45;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }

      for (const n of nodes) {
        if (!visible(n)) continue;
        const dim = (focusSet && !focusSet.has(n.id)) || (query && !matches(n));
        ctx.globalAlpha = dim ? 0.18 : 1;
        ctx.fillStyle = folderColor.get(n.folder);
        ctx.beginPath(); ctx.arc(n.x, n.y, radius(n), 0, Math.PI * 2); ctx.fill();
        if (n === selected || matches(n)) {
          ctx.strokeStyle = colors.text; ctx.lineWidth = 2 / view.k;
          ctx.beginPath(); ctx.arc(n.x, n.y, radius(n) + 3 / view.k, 0, Math.PI * 2); ctx.stroke();
        }
      }

      // Labels: always for focused neighborhood and search hits, otherwise only when zoomed in or for hubs.
      ctx.font = `${12 / view.k}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign = 'center';
      for (const n of nodes) {
        if (!visible(n)) continue;
        const crowded = focusSet && focusSet.size > 16;
        const show = n === focus || matches(n) ||
          (focusSet && focusSet.has(n.id) && (!crowded || n.degree >= 8 || view.k > 1.6)) ||
          (!focusSet && !query && (view.k > 1.4 || n.degree >= 14));
        if (!show) continue;
        ctx.globalAlpha = 1;
        ctx.fillStyle = colors.text;
        ctx.lineWidth = 3 / view.k;
        ctx.strokeStyle = colors.bg;
        const label = n.title.length > 34 ? n.title.slice(0, 32) + '…' : n.title;
        ctx.strokeText(label, n.x, n.y + radius(n) + 13 / view.k);
        ctx.fillText(label, n.x, n.y + radius(n) + 13 / view.k);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function loop() {
      for (let i = 0; i < 2; i++) step();
      draw();
      requestAnimationFrame(loop);
    }

    function toWorld(px, py) {
      const r = canvas.getBoundingClientRect();
      return { x: (px - r.left - r.width / 2 - view.x) / view.k, y: (py - r.top - r.height / 2 - view.y) / view.k };
    }

    function nodeAt(px, py) {
      const p = toWorld(px, py);
      let best = null, bestD = Infinity;
      for (const n of nodes) {
        if (!visible(n)) continue;
        const d = Math.hypot(n.x - p.x, n.y - p.y);
        if (d < radius(n) + 6 / view.k && d < bestD) { best = n; bestD = d; }
      }
      return best;
    }

    function fit() {
      const vis = nodes.filter(visible);
      if (!vis.length) return;
      const xs = vis.map((n) => n.x), ys = vis.map((n) => n.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const w = canvas.clientWidth, h = canvas.clientHeight;
      view.k = Math.min(2.5, Math.max(0.2, 0.85 * Math.min(w / (maxX - minX + 80), h / (maxY - minY + 80))));
      view.x = -((minX + maxX) / 2) * view.k;
      view.y = -((minY + maxY) / 2) * view.k;
    }

    async function select(n, center = false) {
      selected = n;
      if (!n) { info.classList.add('hidden'); history.replaceState(null, '', '/graph'); return; }
      history.replaceState(null, '', `#${encodeURIComponent(n.id)}`);
      if (center) { view.x = -n.x * view.k; view.y = -n.y * view.k; }
      info.classList.remove('hidden');
      info.innerHTML = `<div class="row"><span class="badge"><span style="width:8px;height:8px;border-radius:50%;background:${folderColor.get(n.folder)}"></span>${esc(n.folder)}</span><span class="faint small">${n.degree} links</span></div><h3 style="margin-top:10px">${esc(n.title)}</h3><div class="spinner"></div>`;
      try {
        const doc = await api(`/api/documents/${encodeURIComponent(n.id)}`);
        if (selected !== n) return;
        const nb = [...(neighbors.get(n.id) || [])].map((id) => byId.get(id)).filter(Boolean).sort((a, b) => b.degree - a.degree);
        info.innerHTML = `
          <div class="row"><span class="badge"><span style="width:8px;height:8px;border-radius:50%;background:${folderColor.get(n.folder)}"></span>${esc(n.folder)}</span><span class="faint small">${n.degree} links</span><button class="icon-btn" style="margin-left:auto" id="close-info" title="Close">${SB.icon('x')}</button></div>
          <h3 style="margin-top:10px">${esc(n.title)}</h3>
          <div class="row" style="flex-wrap:wrap;gap:4px">${(doc.tags || []).slice(0, 6).map((t) => `<span class="badge">${esc(String(t).replace(/^#/, ''))}</span>`).join('')}</div>
          <div class="excerpt prose">${md(doc.content.replace(/^\s*#\s+.*\n/, '').slice(0, 900), { shiftHeadings: 2 })}</div>
          <div class="row"><a class="btn btn-sm btn-primary" href="/knowledge#${encodeURIComponent(n.id)}">Open document</a><a class="btn btn-sm" href="/app?q=${encodeURIComponent('Summarize ' + n.title)}">Ask about it</a></div>
          <h4>Connected (${nb.length})</h4>
          ${nb.slice(0, 30).map((m) => `<button class="neighbor" data-id="${esc(m.id)}"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${folderColor.get(m.folder)};margin-right:7px"></span>${esc(m.title)}</button>`).join('')}`;
        info.querySelector('#close-info').addEventListener('click', () => select(null));
        info.querySelectorAll('.neighbor').forEach((b) => b.addEventListener('click', () => select(byId.get(b.dataset.id), true)));
      } catch (err) {
        info.innerHTML += `<p class="small" style="color:var(--danger)">${esc(err.message)}</p>`;
      }
    }

    function renderLegend() {
      const counts = new Map();
      for (const n of nodes) counts.set(n.folder, (counts.get(n.folder) || 0) + 1);
      const el = document.getElementById('legend');
      el.innerHTML = `<div class="legend-title">Folders <button id="toggle-all">${hidden.size ? 'Show all' : 'Hide all'}</button></div>` +
        [...folderColor.entries()].map(([f, c]) => `<label><input type="checkbox" data-f="${esc(f)}" ${hidden.has(f) ? '' : 'checked'}><span class="sw" style="background:${c}"></span>${esc(f)}<span class="n">${counts.get(f)}</span></label>`).join('');
      el.querySelectorAll('input').forEach((cb) => cb.addEventListener('change', () => {
        if (cb.checked) hidden.delete(cb.dataset.f); else hidden.add(cb.dataset.f);
        alpha = Math.max(alpha, 0.4);
        renderLegend(); updateHud();
      }));
      el.querySelector('#toggle-all').addEventListener('click', () => {
        if (hidden.size) hidden.clear(); else folderColor.forEach((_, f) => hidden.add(f));
        renderLegend(); updateHud();
      });
    }

    function updateHud() {
      const vis = nodes.filter(visible);
      const visIds = new Set(vis.map((n) => n.id));
      const visLinks = links.filter((l) => visIds.has(l.source) && visIds.has(l.target)).length;
      document.getElementById('hud').innerHTML = `<span>${vis.length} documents</span><span>${visLinks} links</span><span>Scroll to zoom · drag to pan · click a node</span>`;
    }

    // Interaction
    let drag = null;
    canvas.addEventListener('mousedown', (e) => {
      const n = nodeAt(e.clientX, e.clientY);
      drag = { node: n, sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
      if (n) { n.fixed = true; }
      canvas.classList.add('dragging');
    });
    window.addEventListener('mousemove', (e) => {
      if (drag) {
        const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
        if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
        if (drag.node) {
          const p = toWorld(e.clientX, e.clientY);
          drag.node.x = p.x; drag.node.y = p.y;
          alpha = Math.max(alpha, 0.15);
        } else {
          view.x = drag.vx + dx; view.y = drag.vy + dy;
        }
        return;
      }
      if (e.target !== canvas) return;
      const n = nodeAt(e.clientX, e.clientY);
      if (n !== hovered) { hovered = n; canvas.style.cursor = n ? 'pointer' : ''; }
    });
    window.addEventListener('mouseup', () => {
      if (!drag) return;
      if (drag.node) drag.node.fixed = false;
      if (!drag.moved) select(drag.node || null);
      drag = null;
      canvas.classList.remove('dragging');
    });
    canvas.addEventListener('mouseleave', () => { hovered = null; });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left - r.width / 2, my = e.clientY - r.top - r.height / 2;
      const factor = Math.exp(-e.deltaY * 0.0015);
      const k = Math.min(5, Math.max(0.15, view.k * factor));
      view.x = mx - ((mx - view.x) * k) / view.k;
      view.y = my - ((my - view.y) * k) / view.k;
      view.k = k;
    }, { passive: false });
    document.getElementById('zoom-in').addEventListener('click', () => { view.k = Math.min(5, view.k * 1.25); view.x *= 1.25; view.y *= 1.25; });
    document.getElementById('zoom-out').addEventListener('click', () => { view.k = Math.max(0.15, view.k / 1.25); view.x /= 1.25; view.y /= 1.25; });
    document.getElementById('zoom-fit').addEventListener('click', fit);
    document.getElementById('search').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); });
    document.getElementById('search').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const hit = nodes.find((n) => visible(n) && matches(n));
        if (hit) select(hit, true);
      }
    });
    window.addEventListener('resize', resize);
    window.addEventListener('sb-theme', readColors);

    (async () => {
      resize();
      try {
        const g = await api('/api/graph');
        nodes = g.nodes.map((n, i) => {
          const angle = i * 2.399963;
          const r = 14 * Math.sqrt(i + 1);
          return { id: n.id, title: SB.cleanTitle(n.title), folder: n.folder, x: Math.cos(angle) * r, y: Math.sin(angle) * r, vx: 0, vy: 0, degree: 0 };
        });
        byId = new Map(nodes.map((n) => [n.id, n]));
        const seen = new Set();
        links = (g.links || g.edges || []).map((l) => ({ source: l.source?.id || l.source, target: l.target?.id || l.target }))
          .filter((l) => byId.has(l.source) && byId.has(l.target) && l.source !== l.target)
          .filter((l) => { const k = [l.source, l.target].sort().join('|'); if (seen.has(k)) return false; seen.add(k); return true; });
        for (const l of links) {
          byId.get(l.source).degree++; byId.get(l.target).degree++;
          if (!neighbors.has(l.source)) neighbors.set(l.source, new Set());
          if (!neighbors.has(l.target)) neighbors.set(l.target, new Set());
          neighbors.get(l.source).add(l.target); neighbors.get(l.target).add(l.source);
        }
        [...new Set(nodes.map((n) => n.folder))].sort().forEach((f) => folderColor.set(f, ''));
        readColors();
        for (let i = 0; i < 300; i++) step();
        fit();
        renderLegend();
        updateHud();
        loop();
        const initial = decodeURIComponent(location.hash.slice(1));
        if (initial && byId.has(initial)) select(byId.get(initial), true);
      } catch (err) {
        document.getElementById('stage').innerHTML = `<div class="empty">Couldn't load the graph: ${esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
