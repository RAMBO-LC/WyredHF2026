<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge · SharedBrain</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <script>document.documentElement.dataset.theme = localStorage.getItem('sb-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    body { overflow: hidden; }
    .doc-wrap { max-width: 820px; margin: 0 auto; padding: 32px 32px 64px; }
    .crumbs { font-size: 13px; color: var(--text-faint); display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .doc-title { font-size: 30px; letter-spacing: -0.02em; margin-bottom: 10px; }
    .doc-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--text-muted); padding-bottom: 18px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .doc-actions { margin-left: auto; display: flex; gap: 6px; }
    .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); }
    .links-grid h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin-bottom: 8px; }
    .link-item { display: block; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; font-size: 14px; color: var(--text); }
    .link-item:hover { border-color: var(--accent); text-decoration: none; }
    .link-item small { display: block; color: var(--text-faint); font-size: 12px; }
    .folder-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; border-radius: var(--radius); user-select: none; }
    .folder-head:hover { background: var(--bg-muted); }
    .folder-head svg { width: 14px; height: 14px; color: var(--text-faint); transition: transform 0.12s; }
    .folder-head.open svg.chev { transform: rotate(90deg); }
    .folder-head .count { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--text-faint); }
    .folder-items { padding-left: 12px; }
    .folder-items .side-item { font-size: 13.5px; padding: 5px 8px; }
    .overview h1 { font-size: 26px; margin-bottom: 4px; }
    .folder-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 20px 0 36px; }
    .folder-card { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; cursor: pointer; background: var(--bg); text-align: left; font: inherit; color: var(--text); }
    .folder-card:hover { border-color: var(--border-strong); background: var(--bg-subtle); }
    .folder-card b { display: block; font-size: 14px; }
    .folder-card span { font-size: 13px; color: var(--text-faint); }
    .recent-list .side-item { padding: 9px 10px; border-bottom: 1px solid var(--border); border-radius: 0; }
    .dropzone { position: fixed; inset: 12px; border: 2px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--bg) 85%, transparent); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: var(--accent); z-index: 150; pointer-events: none; }
    .editor-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
    .editor-tabs button { font: inherit; font-size: 13px; border: 1px solid var(--border); background: none; color: var(--text-muted); border-radius: var(--radius); padding: 3px 10px; cursor: pointer; }
    .editor-tabs button.active { background: var(--bg-muted); color: var(--text); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    mark { background: var(--warn-soft); color: inherit; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="row">
          <button class="btn btn-primary grow" id="new-doc"></button>
          <button class="btn" id="import-btn" title="Import files"></button>
          <input type="file" id="file-input" multiple accept=".md,.markdown,.txt,.json,.csv,.log,.yaml,.yml,.ts,.js,.py,.sql" hidden>
        </div>
        <input class="input" id="search" placeholder="Search documents  /">
      </div>
      <div class="sidebar-body" id="tree"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div class="dropzone hidden" id="dropzone">Drop files to import them</div>

  <script src="/assets/common.js"></script>
  <script>
    const { api, esc, md, icon, toast } = SB;
    SB.mountHeader('knowledge');

    const main = document.getElementById('main');
    let docs = [];
    let currentId = null;
    const openFolders = new Set(JSON.parse(localStorage.getItem('sb-open-folders') || '[]'));

    document.getElementById('new-doc').innerHTML = `${icon('plus')} New document`;
    document.getElementById('import-btn').innerHTML = icon('upload');

    function folders() {
      const map = new Map();
      for (const d of docs) {
        if (!map.has(d.folder)) map.set(d.folder, []);
        map.get(d.folder).push(d);
      }
      return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    }

    function renderTree() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const tree = document.getElementById('tree');
      if (q) {
        const hits = docs.filter((d) => d.title.toLowerCase().includes(q) || d.content.toLowerCase().includes(q) || d.tags.join(' ').toLowerCase().includes(q));
        tree.innerHTML = `<div class="sidebar-section">${hits.length} result${hits.length === 1 ? '' : 's'}</div>` +
          (hits.map((d) => `<a class="side-item ${d.id === currentId ? 'active' : ''}" href="#${encodeURIComponent(d.id)}">${icon('file', 'width="14" height="14"')}<span class="truncate">${esc(SB.cleanTitle(d.title))}</span></a>`).join('') || '<div class="empty small">No matches</div>');
        return;
      }
      tree.innerHTML = folders().map(([folder, items]) => {
        const open = openFolders.has(folder) || items.some((d) => d.id === currentId);
        return `
          <div class="folder-head ${open ? 'open' : ''}" data-folder="${esc(folder)}">${icon('chevron', 'class="chev"')}${esc(folder)}<span class="count">${items.length}</span></div>
          <div class="folder-items ${open ? '' : 'hidden'}">
            ${items.map((d) => `<a class="side-item ${d.id === currentId ? 'active' : ''}" href="#${encodeURIComponent(d.id)}"><span class="truncate">${esc(SB.cleanTitle(d.title))}</span></a>`).join('')}
          </div>`;
      }).join('');
      tree.querySelectorAll('.folder-head').forEach((h) => h.addEventListener('click', () => {
        const f = h.dataset.folder;
        if (openFolders.has(f)) openFolders.delete(f); else openFolders.add(f);
        localStorage.setItem('sb-open-folders', JSON.stringify([...openFolders]));
        h.classList.toggle('open');
        h.nextElementSibling.classList.toggle('hidden');
      }));
    }

    function renderOverview() {
      currentId = null;
      renderTree();
      const recent = [...docs]
        .filter((d) => Number.isFinite(new Date(d.updated_at).getTime()))
        .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
        .slice(0, 8);
      const pinned = docs.filter((d) => d.pinned).slice(0, 8);
      main.innerHTML = `
        <div class="doc-wrap overview">
          <h1>Knowledge</h1>
          <p class="muted">${docs.length} documents in ${folders().length} folders. Everything here is searchable from <a href="/app">Ask</a>.</p>
          <div class="folder-cards">
            ${folders().map(([f, items]) => `<button class="folder-card" data-folder="${esc(f)}"><b>${esc(f)}</b><span>${items.length} document${items.length === 1 ? '' : 's'}</span></button>`).join('')}
          </div>
          <div class="grid2" style="gap:32px">
            <div><div class="sidebar-section" style="padding-left:0">Recently updated</div><div class="recent-list">${(recent.length ? recent : docs.slice(0, 8)).map(docRow).join('')}</div></div>
            <div><div class="sidebar-section" style="padding-left:0">Pinned</div><div class="recent-list">${pinned.map(docRow).join('') || '<div class="faint small">Nothing pinned.</div>'}</div></div>
          </div>
          <div class="card card-pad" style="margin-top:36px">
            <b>Add knowledge</b>
            <p class="muted small" style="margin:4px 0 12px">Write a document, import files, or drag files anywhere onto this page. Imported files are chunked, indexed, and distilled into memories with evidence.</p>
            <div class="row"><button class="btn btn-sm" data-act="new">${icon('plus')} New document</button><button class="btn btn-sm" data-act="import">${icon('upload')} Import files</button></div>
          </div>
        </div>`;
      main.querySelectorAll('.folder-card').forEach((c) => c.addEventListener('click', () => {
        openFolders.add(c.dataset.folder);
        renderTree();
        document.querySelector(`.folder-head[data-folder="${CSS.escape(c.dataset.folder)}"]`)?.scrollIntoView({ block: 'start' });
      }));
      main.querySelector('[data-act="new"]').addEventListener('click', () => openEditor());
      main.querySelector('[data-act="import"]').addEventListener('click', () => document.getElementById('file-input').click());
    }

    function docRow(d) {
      return `<a class="side-item" href="#${encodeURIComponent(d.id)}"><span class="truncate grow">${esc(SB.cleanTitle(d.title))}</span><span class="faint small">${esc(d.folder)}</span></a>`;
    }

    async function showDoc(id) {
      let doc;
      try {
        doc = await api(`/api/documents/${encodeURIComponent(id)}`);
      } catch {
        main.innerHTML = `<div class="empty">Document not found. <a href="#">Back to overview</a></div>`;
        return;
      }
      currentId = doc.id;
      renderTree();
      const updated = Number.isFinite(new Date(doc.updated_at).getTime()) ? SB.timeAgo(doc.updated_at) : String(doc.updated_at || '').replace(/^updated\s+/i, '');
      main.innerHTML = `
        <article class="doc-wrap">
          <div class="crumbs"><a href="#">Knowledge</a> / <span>${esc(doc.folder)}</span></div>
          <h1 class="doc-title">${esc(SB.cleanTitle(doc.title))}</h1>
          <div class="doc-meta">
            ${doc.pinned ? '<span class="badge accent">Pinned</span>' : ''}
            <span>${esc(doc.author)}</span><span>·</span><span>Updated ${esc(updated)}</span>
            ${(doc.tags || []).slice(0, 6).map((t) => `<span class="badge">${esc(String(t).replace(/^#/, ''))}</span>`).join('')}
            <div class="doc-actions">
              <a class="btn btn-sm" href="/app?q=${encodeURIComponent('Summarize ' + SB.cleanTitle(doc.title))}">${icon('message')} Ask</a>
              <a class="btn btn-sm" href="/graph#${encodeURIComponent(doc.id)}">${icon('graph')} Graph</a>
              <button class="btn btn-sm" data-act="edit">${icon('edit')} Edit</button>
              <button class="btn btn-sm btn-danger" data-act="delete" title="Delete">${icon('trash')}</button>
            </div>
          </div>
          <div class="prose">${md(doc.content)}</div>
          ${(doc.backlinks?.length || doc.outgoing?.length) ? `
          <div class="links-grid">
            <div><h4>Linked from (${doc.backlinks.length})</h4>${doc.backlinks.map(linkItem).join('') || '<div class="faint small">No backlinks.</div>'}</div>
            <div><h4>Links to (${doc.outgoing.length})</h4>${doc.outgoing.map(linkItem).join('') || '<div class="faint small">No outgoing links.</div>'}</div>
          </div>` : ''}
        </article>`;
      main.scrollTop = 0;
      main.querySelector('[data-act="edit"]').addEventListener('click', () => openEditor(doc));
      main.querySelector('[data-act="delete"]').addEventListener('click', async () => {
        if (!(await SB.confirmDialog('Delete document', `Delete "${SB.cleanTitle(doc.title)}"? Its graph links will be removed too.`))) return;
        try {
          await api(`/api/documents/${encodeURIComponent(doc.id)}`, { method: 'DELETE' });
          toast('Document deleted');
          await loadDocs();
          location.hash = '';
        } catch (err) { toast(err.message, 'error'); }
      });
    }

    function linkItem(l) {
      return `<a class="link-item" href="#${encodeURIComponent(l.id)}">${esc(SB.cleanTitle(l.title))}${l.context ? `<small>${esc(l.context)}</small>` : ''}</a>`;
    }

    function openEditor(doc) {
      const folderNames = [...new Set(docs.map((d) => d.folder))].sort();
      const form = document.createElement('div');
      form.innerHTML = `
        <div class="grid2">
          <label class="field"><span>Title</span><input class="input" name="title" value="${esc(doc ? SB.cleanTitle(doc.title) : '')}" placeholder="Deploy policy"></label>
          <label class="field"><span>Folder</span><input class="input" name="folder" list="folder-list" value="${esc(doc ? doc.folder : 'Knowledge')}"><datalist id="folder-list">${folderNames.map((f) => `<option value="${esc(f)}">`).join('')}</datalist></label>
        </div>
        <label class="field"><span>Tags <span class="faint">(comma separated)</span></span><input class="input" name="tags" value="${esc(doc ? (doc.tags || []).join(', ') : '')}"></label>
        <div class="field">
          <div class="editor-tabs"><button type="button" class="active" data-mode="write">Write</button><button type="button" data-mode="preview">Preview</button></div>
          <textarea class="textarea mono" name="content" rows="16" placeholder="# Heading&#10;&#10;Markdown is supported. Link other notes with [[Note title]].">${esc(doc ? doc.content : '')}</textarea>
          <div class="prose card card-pad hidden" data-preview style="min-height:200px"></div>
        </div>
        <label class="row small"><input type="checkbox" name="pinned" ${doc?.pinned ? 'checked' : ''}> Pin this document</label>`;
      const ta = form.querySelector('textarea');
      const preview = form.querySelector('[data-preview]');
      form.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
        form.querySelectorAll('[data-mode]').forEach((x) => x.classList.toggle('active', x === b));
        const isPreview = b.dataset.mode === 'preview';
        ta.classList.toggle('hidden', isPreview);
        preview.classList.toggle('hidden', !isPreview);
        if (isPreview) preview.innerHTML = md(ta.value) || '<p class="faint">Nothing to preview.</p>';
      }));
      SB.modal({
        title: doc ? 'Edit document' : 'New document',
        body: form,
        actions: [
          { label: 'Cancel' },
          {
            label: doc ? 'Save changes' : 'Create document',
            primary: true,
            onClick: async () => {
              const title = form.querySelector('[name=title]').value.trim();
              const content = ta.value;
              if (!title || !content.trim()) { toast('Title and content are required', 'error'); return false; }
              const folder = form.querySelector('[name=folder]').value.trim() || 'Knowledge';
              const saved = await api('/api/documents', {
                method: 'POST',
                body: {
                  id: doc?.id,
                  title: title.endsWith('.md') ? title : `${title}.md`,
                  folder,
                  content,
                  tags: form.querySelector('[name=tags]').value.split(',').map((t) => t.trim()).filter(Boolean),
                  pinned: form.querySelector('[name=pinned]').checked,
                },
              });
              toast(doc ? 'Document saved' : 'Document created');
              await loadDocs();
              if (location.hash === `#${encodeURIComponent(saved.id)}`) showDoc(saved.id);
              else location.hash = encodeURIComponent(saved.id);
            },
          },
        ],
      });
      setTimeout(() => form.querySelector(doc ? 'textarea' : '[name=title]').focus(), 30);
    }

    async function importFiles(fileList) {
      const files = [...fileList];
      if (!files.length) return;
      let ok = 0;
      for (const f of files) {
        try {
          if (f.size > 5 * 1024 * 1024) throw new Error('larger than 5 MB');
          const content = await f.text();
          if (!content.trim()) throw new Error('file is empty');
          const title = f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
          const r = await api('/api/ingest', { method: 'POST', body: { title, content, folder: 'Imported', sourceRef: `upload:${f.name}`, tags: ['imported'] } });
          ok++;
          toast(`Imported ${f.name}: ${r.chunksCreated} chunks, ${r.memoriesDistilled.length} memories`);
        } catch (err) {
          toast(`${f.name}: ${err.message}`, 'error');
        }
      }
      if (ok) {
        await loadDocs();
        openFolders.add('Imported');
        renderTree();
      }
    }

    async function loadDocs() {
      docs = await api('/api/documents');
    }

    async function route() {
      const hash = decodeURIComponent(location.hash.slice(1));
      if (!hash) return renderOverview();
      if (hash.startsWith('title=')) {
        const wanted = hash.slice(6).toLowerCase();
        const match = docs.find((d) => SB.cleanTitle(d.title).toLowerCase() === wanted) || docs.find((d) => d.title.toLowerCase().includes(wanted));
        if (match) { location.replace(`#${encodeURIComponent(match.id)}`); return; }
        main.innerHTML = `<div class="empty">No document titled “${esc(hash.slice(6))}”. <a href="#">Back to overview</a></div>`;
        return;
      }
      showDoc(hash);
    }

    document.getElementById('search').addEventListener('input', renderTree);
    document.getElementById('new-doc').addEventListener('click', () => openEditor());
    document.getElementById('import-btn').addEventListener('click', () => document.getElementById('file-input').click());
    document.getElementById('file-input').addEventListener('change', (e) => { importFiles(e.target.files); e.target.value = ''; });
    window.addEventListener('hashchange', route);
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && !e.target.closest('input, textarea')) { e.preventDefault(); document.getElementById('search').focus(); }
    });

    const dz = document.getElementById('dropzone');
    let dragDepth = 0;
    window.addEventListener('dragenter', (e) => { if (e.dataTransfer?.types.includes('Files')) { dragDepth++; dz.classList.remove('hidden'); } });
    window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dz.classList.add('hidden'); });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; dz.classList.add('hidden'); importFiles(e.dataTransfer.files); });

    loadDocs().then(route).catch((err) => { main.innerHTML = `<div class="empty">Couldn't load documents: ${esc(err.message)}</div>`; });
  </script>
</body>
</html>
